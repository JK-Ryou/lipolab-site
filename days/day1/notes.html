<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리포랩 3기 Day 1 — 강의정리노트</title>
<style>
:root{
  --bg:#faf8f4; --surface:#ffffff; --ink:#1d2a2e; --muted:#5d6b70; --line:#e4dfd5;
  --accent:#0f6e6e; --accent-soft:#e1f0ee; --warm:#c8552e; --warm-soft:#fbe9e2;
  --code-bg:#f1eee7; --side:#f3efe7; --sw:240px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#14191b; --surface:#1b2225; --ink:#e8ecea; --muted:#9aa8ab; --line:#2c373b;
    --accent:#5cc2bd; --accent-soft:#16302f; --warm:#f08a63; --warm-soft:#3a231b;
    --code-bg:#222b2e; --side:#192023;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.8;font-size:16px;-webkit-font-smoothing:antialiased}

/* layout */
.layout{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);min-height:100vh}
@media(max-width:780px){.layout{grid-template-columns:1fr}.toc-wrap{display:none}}

/* toc sidebar */
.toc-wrap{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.toc-head{padding:20px 16px 12px;border-bottom:1px solid var(--line)}
.toc-head .back{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.toc-head .back:hover{text-decoration:underline}
.toc-head .label{display:block;font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--accent);margin-top:14px}
.toc-head .title{font-size:14px;font-weight:700;margin-top:2px;line-height:1.4}
nav.toc{padding:10px 8px 24px;flex:1}
nav.toc a{display:block;text-decoration:none;color:var(--muted);border-radius:7px;padding:4px 10px;font-size:13px;line-height:1.5;transition:color .1s}
nav.toc a:hover{color:var(--accent);background:var(--accent-soft)}
nav.toc a.active{color:var(--accent);font-weight:600}
nav.toc a.h1{font-weight:700;color:var(--ink);font-size:13.5px;margin-top:6px}
nav.toc a.h2{padding-left:18px}
nav.toc a.h3{padding-left:28px;font-size:12.5px}
nav.toc a.h4{padding-left:36px;font-size:12px;color:var(--muted)}

/* main */
.main{min-width:0;padding:32px 40px 80px}
@media(max-width:780px){.main{padding:24px 20px 60px}}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.back-m{display:none;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;padding:5px 12px;border:1px solid var(--accent);border-radius:999px}
.back-m:hover{background:var(--accent-soft)}
@media(max-width:780px){.back-m{display:inline-flex}}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--warm-soft);color:var(--warm);font-size:12px;font-weight:600}
.topbar-title{font-size:14px;color:var(--muted)}

/* content */
#content h1{font-size:clamp(20px,3.5vw,30px);line-height:1.3;margin:32px 0 8px;letter-spacing:-.02em;border-bottom:2px solid var(--line);padding-bottom:10px}
#content h2{font-size:21px;margin:36px 0 8px;letter-spacing:-.01em;border-bottom:1px solid var(--line);padding-bottom:6px}
#content h3{font-size:17px;margin:26px 0 6px}
#content h4{font-size:15px;margin:18px 0 4px;color:var(--accent)}
#content p{margin:8px 0}
#content ul,#content ol{margin:8px 0;padding-left:24px}
#content li{margin:4px 0}
#content blockquote{margin:12px 0;padding:10px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
#content code{background:var(--code-bg);padding:1px 6px;border-radius:5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
#content pre{background:var(--code-bg);padding:14px 16px;border-radius:10px;overflow:auto;font-size:14px;line-height:1.6;margin:12px 0}
#content pre code{background:none;padding:0}
#content img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin:10px 0;display:block}
#content table{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#content th,#content td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
#content th{background:var(--code-bg);font-size:13px;color:var(--muted)}
#content tr:last-child td{border-bottom:0}
#content hr{border:none;border-top:1px solid var(--line);margin:28px 0}
.loading{color:var(--muted);padding:40px 0;text-align:center}
</style>
</head>
<body>
<div class="layout">
  <aside class="toc-wrap">
    <div class="toc-head">
      <a class="back" href="summary.html" target="_top">← 요약본으로</a>
      <span class="label">DAY 1 · 강의정리노트</span>
      <div class="title">원본 노트</div>
    </div>
    <nav class="toc" id="toc"><p style="padding:10px;font-size:13px;color:var(--muted)">불러오는 중...</p></nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <a class="back-m" href="summary.html" target="_top">← 요약본으로</a>
      <span class="topbar-title">리포랩 3기 · DAY 1 강의정리노트</span>
      <span class="badge">원본</span>
    </div>
    <div id="content"><p class="loading">불러오는 중...</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function(){
  function convertObsidian(text){
    return text.replace(/!\[\[([^\]|]+\.(?:png|jpg|jpeg|gif|webp))(?:\|[^\]]+)?\]\]/gi, function(_, name){
      return '![](' + 'images/' + encodeURIComponent(name) + ')';
    });
  }

  function buildToc(){
    var toc = document.getElementById('toc');
    var headings = document.getElementById('content').querySelectorAll('h1,h2,h3,h4');
    if(!headings.length){toc.innerHTML='';return;}
    var html='';
    var counts={};
    headings.forEach(function(h){
      var tag=h.tagName.toLowerCase();
      var text=h.textContent.trim();
      var base=text.toLowerCase().replace(/[^\w가-힣]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
      counts[base]=(counts[base]||0)+1;
      var id=counts[base]>1?base+'-'+counts[base]:base;
      h.id=id;
      html+='<a class="'+tag+'" href="#'+id+'">'+text+'</a>';
    });
    toc.innerHTML=html;

    // active highlight on scroll
    var links=toc.querySelectorAll('a');
    var observer=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          links.forEach(function(l){l.classList.remove('active')});
          var a=toc.querySelector('a[href="#'+e.target.id+'"]');
          if(a){a.classList.add('active');a.scrollIntoView({block:'nearest'})}
        }
      });
    },{rootMargin:'-10% 0px -80% 0px'});
    headings.forEach(function(h){observer.observe(h)});
  }

  fetch('notes.md')
    .then(function(r){return r.text()})
    .then(function(raw){
      var md=convertObsidian(raw);
      document.getElementById('content').innerHTML=marked.parse(md);
      buildToc();
    })
    .catch(function(){
      document.getElementById('content').innerHTML='<p style="color:var(--warm)">노트 파일을 불러오지 못했습니다.</p>';
      document.getElementById('toc').innerHTML='';
    });
})();
</script>
</body>
</html>
