<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리포랩 3기 Day 1 — 강의정리노트</title>
<style>
:root{
  --bg:#faf8f4; --surface:#ffffff; --ink:#1d2a2e; --muted:#5d6b70; --line:#e4dfd5;
  --accent:#0f6e6e; --accent-soft:#e1f0ee; --warm:#c8552e; --warm-soft:#fbe9e2;
  --code-bg:#f1eee7;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14191b; --surface:#1b2225; --ink:#e8ecea; --muted:#9aa8ab; --line:#2c373b;
    --accent:#5cc2bd; --accent-soft:#16302f; --warm:#f08a63; --warm-soft:#3a231b;
    --code-bg:#222b2e;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.72;font-size:16px;-webkit-font-smoothing:antialiased}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1180px;margin:0 auto;gap:40px;padding:0 20px}
@media(max-width:960px){.layout{grid-template-columns:1fr}}

aside.toc{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:36px 0 24px;font-size:14px}
@media(max-width:960px){aside.toc{display:none}}
.toc b{display:block;font-size:12px;letter-spacing:.08em;color:var(--accent);margin-bottom:8px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:4px 0 4px 10px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--accent);border-left-color:var(--accent)}
.toc a.active{color:var(--accent);border-left-color:var(--accent);font-weight:600}
.toc a.h2{padding-left:22px;font-size:13px}
.toc a.h3{padding-left:34px;font-size:12.5px}
.toc a.h4{padding-left:44px;font-size:12px}
.toc-back{display:block;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;margin-bottom:16px}
.toc-back:hover{text-decoration:underline}

main{padding-bottom:100px;min-width:0}
.topbar{padding:36px 0 20px;border-bottom:1px solid var(--line);margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;padding:5px 14px;border:1px solid var(--accent);border-radius:999px}
.back:hover{background:var(--accent-soft)}
.topbar-label{font-size:13px;letter-spacing:.06em;font-weight:700;color:var(--accent)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--warm-soft);color:var(--warm);font-size:12px;font-weight:600}

#content h1{font-size:clamp(20px,3.5vw,30px);line-height:1.3;margin:32px 0 8px;letter-spacing:-.02em;border-bottom:2px solid var(--line);padding-bottom:10px}
#content h2{font-size:21px;margin:36px 0 8px;letter-spacing:-.01em;border-bottom:1px solid var(--line);padding-bottom:6px}
#content h3{font-size:17px;margin:26px 0 6px}
#content h4{font-size:15px;margin:18px 0 4px;color:var(--accent)}
#content p{margin:8px 0}
#content ul,#content ol{margin:8px 0;padding-left:24px}
#content li{margin:4px 0}
#content blockquote{margin:12px 0;padding:10px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
#content code{background:var(--code-bg);padding:1px 6px;border-radius:5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
#content pre{background:var(--code-bg);padding:14px 16px;border-radius:10px;overflow:auto;font-size:14px;line-height:1.6;margin:12px 0}
#content pre code{background:none;padding:0}
#content table{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#content th,#content td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
#content th{background:var(--code-bg);font-size:13px;color:var(--muted)}
#content tr:last-child td{border-bottom:0}
#content hr{border:none;border-top:1px solid var(--line);margin:28px 0}
#content img{max-width:min(100%,1080px);height:auto;border-radius:10px;border:1px solid var(--line);margin:12px 0;display:block;cursor:zoom-in}

/* lightbox */
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:999;align-items:center;justify-content:center;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:92vw;max-height:92vh;border-radius:10px;object-fit:contain;box-shadow:0 8px 48px rgba(0,0,0,.6)}
.lb-close{position:fixed;top:16px;right:20px;color:#fff;font-size:26px;cursor:pointer;opacity:.75;background:none;border:0;padding:6px;line-height:1}
.lb-close:hover{opacity:1}

.loading{color:var(--muted);padding:40px 0;text-align:center}
@media print{aside.toc{display:none}.layout{display:block}}
</style>
</head>
<body>
<div class="layout">

<aside class="toc" aria-label="목차">
  <a class="toc-back" href="summary.html" target="_top">← 요약본으로</a>
  <b>노트 목차</b>
  <div id="toc"><span style="color:var(--muted)">불러오는 중...</span></div>
</aside>

<main>
  <div class="topbar">
    <a class="back" href="summary.html" target="_top">← 요약본으로</a>
    <span class="topbar-label">DAY 1 · 강의정리노트</span>
    <span class="badge">원본</span>
  </div>
  <div id="content"><p class="loading">불러오는 중...</p></div>
</main>

</div>

<div class="lb" id="lb"><button class="lb-close" id="lb-close" aria-label="닫기">✕</button><img id="lb-img" src="" alt="확대 이미지"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function(){
  /* lightbox */
  var lb=document.getElementById('lb'),lbImg=document.getElementById('lb-img');
  function openLb(src){lbImg.src=src;lb.classList.add('on');document.body.style.overflow='hidden'}
  function closeLb(){lb.classList.remove('on');document.body.style.overflow='';lbImg.src=''}
  lb.addEventListener('click',function(e){if(e.target===lb||e.target===document.getElementById('lb-close'))closeLb()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb()});

  /* obsidian wikilink → img */
  function convertObsidian(text){
    return text.replace(/!\[\[([^\]|]+\.(?:png|jpg|jpeg|gif|webp))(?:\|[^\]]+)?\]\]/gi,function(_,name){
      return '![](images/'+encodeURIComponent(name)+')';
    });
  }

  /* build TOC from headings */
  function buildToc(){
    var toc=document.getElementById('toc');
    var headings=document.getElementById('content').querySelectorAll('h1,h2,h3,h4');
    if(!headings.length){toc.innerHTML='';return}
    var counts={},html='';
    headings.forEach(function(h){
      var tag=h.tagName.toLowerCase();
      var text=h.textContent.trim();
      var base=text.toLowerCase().replace(/\s+/g,'-').replace(/[^\w가-힣-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'');
      counts[base]=(counts[base]||0)+1;
      var id=counts[base]>1?base+'-'+counts[base]:base;
      h.id=id;
      html+='<a class="'+tag+'" href="#'+id+'">'+text+'</a>';
    });
    toc.innerHTML=html;
    var links=toc.querySelectorAll('a');
    var observer=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          links.forEach(function(l){l.classList.remove('active')});
          var a=toc.querySelector('a[href="#'+e.target.id+'"]');
          if(a){a.classList.add('active');a.scrollIntoView({block:'nearest'})}
        }
      });
    },{rootMargin:'-5% 0px -80% 0px'});
    headings.forEach(function(h){observer.observe(h)});
  }

  fetch('notes.md')
    .then(function(r){return r.text()})
    .then(function(raw){
      document.getElementById('content').innerHTML=marked.parse(convertObsidian(raw));
      buildToc();
      document.getElementById('content').querySelectorAll('img').forEach(function(img){
        img.addEventListener('click',function(){openLb(img.src)});
      });
    })
    .catch(function(){
      document.getElementById('content').innerHTML='<p style="color:var(--warm)">노트 파일을 불러오지 못했습니다.</p>';
      document.getElementById('toc').innerHTML='';
    });
})();
</script>
</body>
</html>
